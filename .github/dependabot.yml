version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ["*"]
    ignore:
      # Types must match the oldest supported Node.js (engines: >=22.13).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Compiler majors get a deliberate upgrade, not a grouped bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: swift
    directory: /macOS
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
